[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "bc-lantern"
version = "0.7.0"
description = "A growing toolbox for Business Central and AL projects"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oliver Schulz" }]
keywords = ["business-central", "al", "cli", "github"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Environment :: Console",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "twine>=6"]

[project.urls]
Homepage = "https://github.com/SchulzOli/bc-lantern"
Documentation = "https://github.com/SchulzOli/bc-lantern#readme"
Issues = "https://github.com/SchulzOli/bc-lantern/issues"
Source = "https://github.com/SchulzOli/bc-lantern"

[project.scripts]
bcl = "bc_lantern.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bc_lantern"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
